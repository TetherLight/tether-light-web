<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | Tether Light</title>
<meta name="description" content="Tether Lightへのお問い合わせはこちらのフォームからお願いいたします。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Inter+Tight:wght@300;400;500;600;700;800&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header header--solid" id="header">
  <div class="container header__inner">
    <a href="index.html#top" class="logo">
      <img src="images/logo-icon-white.png" alt="" class="logo__mark logo__mark--white" aria-hidden="true">
      <img src="images/logo-icon-blue.png" alt="" class="logo__mark logo__mark--blue" aria-hidden="true">
      <img src="images/logo-text-white.png" alt="Tether Light" class="logo__text-img logo__text-img--white">
      <img src="images/logo-text-blue.png" alt="Tether Light" class="logo__text-img logo__text-img--blue">
    </a>

    <nav class="nav" id="nav">
      <ul class="nav__list">
        <li><a href="index.html#business" class="nav__link">事業内容</a></li>
        <li><a href="index.html#news" class="nav__link">ニュース</a></li>
        <li><a href="index.html#company" class="nav__link">会社概要</a></li>
        <li><a href="contact.html" class="nav__link nav__link--cta">お問い合わせ</a></li>
      </ul>
    </nav>

    <button class="nav-toggle" id="navToggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="nav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main class="article">
  <div class="container article__inner">
    <p class="section-tag" data-animate>CONTACT</p>
    <h1 class="article__title" style="border-bottom: none;" data-animate>お問い合わせ</h1>
    <p class="section-lead" style="margin: 0 0 40px; text-align: left;" data-animate>
      撮影のご依頼、動画制作のご依頼、お見積もりなど、お気軽にお問い合わせください。<br class="br-pc">
      内容を確認のうえ、担当者よりご連絡いたします。
    </p>

    <form class="contact-form" action="https://formspree.io/f/xyegwvlp" method="POST" id="contactForm" data-animate>

      <div class="form-field">
        <label class="form-label" for="name">
          お名前
          <span class="form-label__badge form-label__badge--required">必須</span>
        </label>
        <input class="form-input" type="text" id="name" name="name" placeholder="山田 太郎" required>
      </div>

      <div class="form-field">
        <label class="form-label" for="company">
          会社名
          <span class="form-label__badge form-label__badge--optional">任意</span>
        </label>
        <input class="form-input" type="text" id="company" name="company" placeholder="株式会社サンプル">
      </div>

      <div class="form-field">
        <label class="form-label" for="email">
          メールアドレス
          <span class="form-label__badge form-label__badge--required">必須</span>
        </label>
        <input class="form-input" type="email" id="email" name="email" placeholder="example@tetherlight.jp" required>
      </div>

      <div class="form-field">
        <label class="form-label" for="tel">
          電話番号
          <span class="form-label__badge form-label__badge--optional">任意</span>
        </label>
        <input class="form-input" type="tel" id="tel" name="tel" placeholder="090-1234-5678">
      </div>

      <div class="form-field">
        <label class="form-label" for="category">
          お問い合わせ種別
          <span class="form-label__badge form-label__badge--required">必須</span>
        </label>
        <select class="form-select" id="category" name="category" required>
          <option value="" disabled selected>選択してください</option>
          <option value="撮影のご依頼">撮影のご依頼</option>
          <option value="動画制作のご依頼">動画制作のご依頼</option>
          <option value="お見積もり">お見積もり</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="form-field">
        <label class="form-label" for="message">
          お問い合わせ内容
          <span class="form-label__badge form-label__badge--required">必須</span>
        </label>
        <textarea class="form-textarea" id="message" name="message" placeholder="お問い合わせ内容をご記入ください" required></textarea>
      </div>

      <div class="form-checkbox-field">
        <input type="checkbox" id="privacy" name="privacy" value="agree" required>
        <label for="privacy">個人情報の取り扱いに同意する</label>
      </div>

      <!-- 送信後のリダイレクト先（JSで絶対URLをセット） -->
      <input type="hidden" name="_next" id="formNext" value="thanks.html">
      <!-- メールの件名 -->
      <input type="hidden" name="_subject" id="formSubject" value="Webサイトお問い合わせ（Tether Light）">
      <!-- スパム対策のおとり項目。人間には見えないようにする -->
      <div style="position: absolute; left: -9999px;" aria-hidden="true">
        <label for="_gotcha">この項目は入力しないでください</label>
        <input type="text" id="_gotcha" name="_gotcha" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" class="btn btn--primary" id="submitBtn">送信する<span class="btn__arrow">→</span></button>
    </form>
  </div>
</main>

<footer class="footer">
  <div class="container footer__inner">
    <a href="index.html#top" class="logo logo--footer">
      <img src="images/logo-icon-blue.png" alt="" class="logo__mark" aria-hidden="true">
      <img src="images/logo-text-blue.png" alt="Tether Light" class="logo__text-img">
    </a>

    <nav class="footer__nav">
      <ul>
        <li><a href="index.html#business">事業内容</a></li>
        <li><a href="index.html#news">ニュース</a></li>
        <li><a href="index.html#company">会社概要</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>
    </nav>
  </div>
  <p class="footer__copy">&copy; 2026 Tether Light Inc. All Rights Reserved.</p>
</footer>

<script src="js/script.js"></script>
<script>
  document.getElementById("formNext").value =
    window.location.origin + window.location.pathname.replace(/contact\.html$/, "thanks.html");

  var categorySelect = document.getElementById("category");
  var subjectField = document.getElementById("formSubject");
  categorySelect.addEventListener("change", function () {
    subjectField.value = "Webサイトお問い合わせ（" + categorySelect.value + "）";
  });

  document.getElementById("contactForm").addEventListener("submit", function () {
    var btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "送信中...";
  });
</script>
</body>
</html>
